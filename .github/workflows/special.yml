name: 'Daily Job(special)'

on:
  schedule:
    - cron: '10 23 * * *'  # UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Daily Job(special)'
        required: true
        default: 'production'

jobs:
  run_job:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Run Python script
      run: python assets/special/special.py

    - name: Commit changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add assets/special/special.txt
        if git diff --cached --quiet; then
          echo "special 数据文件无变更，跳过提交"
        else
          git commit -m ":tv:  (special)AutoUpdate $(date -d "+8 hours" +'%Y%m%d')"
        fi

    - name: Push changes
      run: |
        git pull --rebase origin main
        git push origin main
