name: 'Daily Job(freetv)'

on:
  schedule:
- cron: '25 5 * * *'
    - cron: '25 20 * * *'  # 每天UTC时间23:25运行
  workflow_dispatch:
    inputs:
      environment:
        description: 'Daily Job(freetv)'
        required: true
        default: 'production'

jobs:
  run_job:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Run Python script
      run: python assets/freetv/freetv.py

    - name: Commit changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"

        # 1) 数据文件：有变更才提交，无变更不报错
        git add assets/freetv/freetv_output.txt assets/freetv/freetv_output_cctv.txt assets/freetv/freetv_output_ws.txt assets/freetv/freetv_output_other.txt
        if git diff --cached --quiet; then
          echo "freetv 数据文件无变更，跳过数据提交"
        else
          git commit -m ":tv:  (Freetv)AutoUpdate $(date -d "+8 hours" +'%Y%m%d')"
        fi

        # 2) 归档 zip：生成并提交，同样做无变更保护
        current_datetime=$(date +"%Y%m%d_%H%M%S")
        zip_filename="${current_datetime}_freetv_output.zip"
        mkdir -p history/freetv
        if [ -f assets/freetv/freetv_output.txt ]; then
          zip "history/freetv/${zip_filename}" assets/freetv/freetv_output.txt 2>/dev/null || true
          git add "history/freetv/${zip_filename}"
          if git diff --cached --quiet; then
            echo "freetv zip 无变更，跳过归档提交"
          else
            git commit -m "(freetv) Archive file as ZIP with timestamp"
          fi
        else
          echo "freetv_output.txt 不存在，跳过归档"
        fi

    - name: Push changes
      run: |
        git pull --rebase origin main
        git push origin main
